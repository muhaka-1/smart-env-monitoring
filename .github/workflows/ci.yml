
name: CI

on:
  pull_request:
    branches: [development, Testing, main]
  push:
    branches: [development, Testing, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install sensor dependencies
        run: pip install -r requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Kontrollera migrationer
        run: cd backend && python manage.py makemigrations --check --dry-run

      - name: Backend-tester
        run: cd backend && python manage.py test

      - name: Sensor-tester
        run: cd sensor && python -m unittest discover -s tests -t .

      - name: Dashboard-tester
        run: node backend/monitoring/tests/dashboard.test.cjs
