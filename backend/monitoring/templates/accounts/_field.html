<div>
  <p>
    <label for="{{ field.id_for_label }}">{{ field.label }}</label><br>
    {{ field }}
  </p>
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error" role="alert">
      {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
