{% load static %}
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badvattenkvalitet – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container"><span class="navbar-brand mb-0 h1">🌊 Badvattenkvalitet</span>
    <span class="navbar-text" id="updated">Laddar…</span></div>
</nav>
<main class="container">
  <div id="error" class="alert alert-danger d-none"></div>
  <div class="row g-3 mb-4" id="cards"></div>
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-2 align-items-end mb-3">
        <div class="col-md-4"><label class="form-label">Sensor</label>
          <select id="sensor" class="form-select"></select></div>
        <div class="col-md-3"><label class="form-label">Från</label>
          <input id="from" type="datetime-local" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Till</label>
          <input id="to" type="datetime-local" class="form-control"></div>
        <div class="col-md-2 d-flex gap-2">
          <button id="apply" class="btn btn-primary w-100">Filtrera</button>
          <button id="reset" class="btn btn-outline-secondary">Nollställ</button></div>
      </div>
      <canvas id="chart" height="110"></canvas>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{% static 'monitoring/dashboard.js' %}"></script>
</body>
</html>
