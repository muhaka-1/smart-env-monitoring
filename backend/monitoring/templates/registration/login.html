<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in</title>
</head>
<body>
  <main>
    <h1>Logga in</h1>
    {% if form.non_field_errors %}
      <p role="alert">Fel användarnamn eller lösenord.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <p><label>Användarnamn <input name="username" autocomplete="username" required></label></p>
      <p><label>Lösenord <input name="password" type="password" autocomplete="current-password" required></label></p>
      <button type="submit">Logga in</button>
    </form>
    <p><a href="{% url 'password_reset' %}">Glömt lösenord?</a></p>
    <p><a href="/">Till den publika dashboarden</a></p>
  </main>
</body>
</html>
